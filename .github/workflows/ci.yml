name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift Build
        working-directory: macos
        run: swift build -c release
      - name: Package .app and upload artifact
        run: |
          ./build.sh
          cd build && zip -qr DesktopWeather-macOS.zip 桌面天气.app
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-weather-macos
          path: build/DesktopWeather-macOS.zip

  windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: .NET Build
        working-directory: windows
        run: dotnet build -c Release
      - name: Publish and package artifact
        run: |
          powershell -ExecutionPolicy Bypass -File windows/build.ps1
          Compress-Archive -Path windows/publish/* -DestinationPath windows/desktop-weather-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-weather-windows
          path: windows/desktop-weather-windows.zip

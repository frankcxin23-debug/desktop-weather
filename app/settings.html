<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>桌面天气设置</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="win">
  <header>
    <h1>桌面天气</h1>
    <p class="sub">把一座城市的天气，变成你桌面的氛围</p>
  </header>

  <section>
    <div class="label">城市</div>
    <div id="worldmap"></div>
    <div class="seg" id="seg">
      <button type="button" data-mode="auto" class="on">自动定位</button>
      <button type="button" data-mode="manual">手动选择城市</button>
    </div>

    <div id="manualArea" class="manual hidden">
      <div class="search">
        <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="6.5" cy="6.5" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5 L14.5 14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="text" placeholder="输入城市名，如：上海 / Tokyo" autocomplete="off" spellcheck="false">
        <div id="spin" class="spin hidden"></div>
      </div>
      <div id="results" class="results"></div>
      <div class="chips-title">国内城市</div>
      <div class="chips" id="chips"></div>
    </div>

    <div id="cityStatus" class="status"></div>

    <div class="label">背景音乐</div>
    <div id="mBody" class="music-card">
      <div class="m-row">
        <span>启用</span>
        <button type="button" id="mSwitch" class="switch" aria-label="启用背景音乐"></button>
      </div>
      <div class="m-row">
        <span>触发方式</span>
        <div class="seg m-seg" id="mSeg">
          <button type="button" data-m="always">总是</button>
          <button type="button" data-m="manual">手动</button>
          <button type="button" data-m="weather">按天气</button>
          <button type="button" data-m="city">按城市</button>
        </div>
      </div>
      <div id="mWeathers" class="chips m-chips hidden"></div>
      <div id="mCityRow" class="m-row hidden">
        <input id="mCities" type="text" placeholder="城市名，逗号分隔，如：上海, 东京" autocomplete="off" spellcheck="false">
      </div>
      <div class="m-row">
        <span>音量</span>
        <input id="mVol" type="range" min="0" max="1" step="0.05">
      </div>
      <div class="hint">按所选地区拉取热门单曲，30 秒预览低音量连播；阴雨天自动偏向低音舒缓曲目。手动模式从菜单栏开关。</div>
    </div>
  </section>

  <hr>

  <section>
    <div class="label">特效强度</div>
    <div class="slider-row">
      <span class="end">淡</span>
      <input type="range" id="intensity" min="20" max="180" step="5" value="100">
      <span class="end">浓</span>
      <span id="pct" class="pct">100%</span>
    </div>
  </section>

  <footer>更改即时生效并自动保存 · 菜单栏 / 托盘图标可刷新或重新定位</footer>
</div>
<script src="js/bridge.js"></script>
<script src="js/weather.js"></script>
<script src="js/worldmap-data.js"></script>
<script src="js/worldmap-ui.js"></script>
<script src="js/settings-ui.js"></script>
</body>
</html>
